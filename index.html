<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>물때 · 오늘 갈 자유수영장</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root{--ink:#24302b;--muted:#6f7b75;--line:#dfe6e1;--paper:#fbfaf6;--mint:#dff2e8;--green:#176b50;--pink:#f5dce5;--yellow:#fff1ba}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR",sans-serif}a{color:inherit}header{position:sticky;top:0;z-index:5;background:#fbfaf6ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{max-width:1120px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px;text-decoration:none}.brand span{color:var(--green)}.map-link{padding:10px 15px;border-radius:999px;background:var(--ink);color:white;text-decoration:none;font-weight:700;font-size:14px}main{max-width:1120px;margin:auto;padding:54px 22px 80px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:28px;align-items:end;margin-bottom:34px}h1{font-size:clamp(36px,6vw,70px);line-height:1.02;letter-spacing:-.055em;margin:0 0 18px}.lead{font-size:18px;line-height:1.7;color:var(--muted);max-width:650px;margin:0}.stamp{background:var(--yellow);padding:22px;border-radius:24px;transform:rotate(2deg);font-weight:800;line-height:1.55}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0}.filter{border:1px solid var(--line);background:white;border-radius:999px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.filter.active{background:var(--green);border-color:var(--green);color:white}.summary{display:flex;justify-content:space-between;align-items:center;margin:18px 0;color:var(--muted)}.summary strong{color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:23px;box-shadow:0 10px 30px #25362d0d}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--mint);color:var(--green);font-size:12px;font-weight:800}.badge.warn{background:var(--yellow);color:#785c00}.badge.call{background:var(--pink);color:#83415b}h2{font-size:23px;letter-spacing:-.035em;margin:12px 0 7px}.type,.address{color:var(--muted);font-size:13px}.address{font-size:14px;margin:15px 0}.times{background:#f5f7f5;border-radius:16px;padding:14px;margin:16px 0;min-height:78px}.time-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:4px 0}.time-row span:last-child{font-weight:800}.price-line{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;font-weight:800;color:var(--green)}.notice{font-size:12px;color:#8a7461;margin-top:8px}.actions{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:13px;padding:12px 10px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}.review-btn{background:var(--green);color:white}.map-btn{background:#eef2ef}.empty{grid-column:1/-1;padding:55px;text-align:center;border:1px dashed #bfc9c2;border-radius:24px;color:var(--muted)}dialog{width:min(760px,calc(100% - 28px));border:0;border-radius:25px;padding:0;box-shadow:0 30px 80px #0004}dialog::backdrop{background:#19231e99}.modal-head{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.modal-head h3{margin:0 0 6px;font-size:23px}.modal-head p{margin:0;color:var(--muted);font-size:13px}.close{border:0;background:#edf1ee;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}.modal-body{padding:22px 24px;max-height:72vh;overflow:auto}.section-title{font-size:15px;margin:0 0 11px}.schedule-box{background:#f5f7f5;border-radius:16px;padding:12px 14px;margin-bottom:16px}.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}.fact{border:1px solid var(--line);border-radius:15px;padding:14px}.fact-label{font-size:11px;font-weight:850;color:var(--green);margin-bottom:7px}.fact-value{font-size:14px;line-height:1.5;font-weight:750}.fact-note{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:5px}.reviews{padding:0}.review{display:block;padding:17px 0;border-bottom:1px solid var(--line);text-decoration:none}.review-title{font-weight:850;line-height:1.45}.review-desc{color:var(--muted);font-size:14px;line-height:1.55;margin:7px 0}.cafe{font-size:12px;color:var(--green);font-weight:750}.loading{padding:28px;text-align:center;color:var(--muted)}@media(max-width:720px){.hero{grid-template-columns:1fr}.stamp{display:none}.grid{grid-template-columns:1fr}main{padding-top:35px}.actions{flex-direction:column}.fact-grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="nav"><a class="brand" href="index.html">물<span>때</span></a><a class="map-link" href="map.html">지도에서 보기 →</a></div></header>
<main><section class="hero"><div><h1>오늘 물에<br>들어갈 수 있을까?</h1><p class="lead">마포구 성인 자유수영장을 시간표와 함께 모았어요. 공식 정보와 확인이 필요한 정보는 구분하고, 실제 이용 후기는 네이버 카페에서 바로 찾아봅니다.</p></div><div class="stamp">🏊 원정 자유수영<br>첫 지역 · 마포구</div></section>
<div class="filters"><button class="filter active" data-filter="전체">전체</button><button class="filter" data-filter="오늘">오늘 가능</button><button class="filter" data-filter="주말">주말 가능</button><button class="filter" data-filter="공식">공식 확인</button></div>
<div class="summary"><div><strong id="count">0곳</strong>을 찾았어요</div><small>시간표는 방문 전 다시 확인해 주세요.</small></div><section class="grid" id="pool-list"><div class="empty">수영장 정보를 불러오는 중이에요.</div></section></main>
<dialog id="review-dialog"><div class="modal-head"><div><h3 id="review-name">수영장 정보</h3><p>시간·요금은 출처 상태를 함께 표시하고, 혼잡·시설은 카페 검색 요약문에서 찾습니다.</p></div><button class="close" aria-label="닫기">×</button></div><div class="modal-body"><h4 class="section-title">자유수영 시간</h4><div class="schedule-box" id="detail-schedule"></div><div class="fact-grid" id="fact-grid"></div><h4 class="section-title">근거가 된 네이버 카페 글</h4><div class="reviews" id="review-list"></div></div></dialog>
<script>
const 상태문구={공식확인:'공식 시간표 확인',부분확인:'일부 공식 확인',전화확인필요:'방문 전 전화 확인'},오늘표현=['일','월','화','수','목','금','토'][new Date().getDay()];let 수영장=[],시간표=[],현재필터='전체';
const 깨끗한글=s=>{const e=document.createElement('textarea');e.innerHTML=String(s||'').replace(/<[^>]*>/g,'');return e.value};
function CSV읽기(주소){return fetch(주소,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(`${주소} ${r.status}`);return r.text()}).then(t=>Papa.parse(t,{header:true,skipEmptyLines:true}).data)}
function 오늘포함(v){if(!v)return false;if(v.includes('평일'))return '월화수목금'.includes(오늘표현);if(v.includes('주말'))return '토일'.includes(오늘표현);if(v.includes('~')){const 순서=['월','화','수','목','금','토','일'],[a,b]=v.split('~');return 순서.indexOf(a)<=순서.indexOf(오늘표현)&&순서.indexOf(오늘표현)<=순서.indexOf(b)}return v.includes(오늘표현)}
function 시간텍스트(t){return t.시작시간?`${t.시작시간}–${t.종료시간}`:'운영처 확인 필요'}
function 가격문구(표){const t=표.find(x=>x.비회원가격원||x.회원가격원);if(!t)return '요금 확인 필요';if(t.비회원가격원)return `비회원 ${Number(t.비회원가격원).toLocaleString()}원`;return `회원 ${Number(t.회원가격원).toLocaleString()}원`}
function 카드(p){const 표=시간표.filter(t=>t.수영장ID===p.수영장ID),오늘=표.filter(t=>오늘포함(t.요일구분)),보여줄표=오늘.length?오늘:표.slice(0,3),클래스=p.정보상태==='공식확인'?'':p.정보상태==='부분확인'?'warn':'call';return `<article class="card"><span class="badge ${클래스}">${상태문구[p.정보상태]||p.정보상태}</span><h2>${p.이름}</h2><span class="type">${p.시설구분} · ${p.레인길이m||'?'}m ${p.레인수?`· ${p.레인수}레인`:''}</span><p class="address">${p.주소}</p><div class="times">${보여줄표.length?보여줄표.map(t=>`<div class="time-row"><span>${t.요일구분}</span><span>${시간텍스트(t)}</span></div>`).join(''):'<div class="notice">등록된 시간표가 없어요.</div>'}<div class="price-line">${가격문구(표)}</div>${p.정보상태!=='공식확인'?'<div class="notice">⚠ 정확한 시간과 요금은 방문 전에 확인해 주세요.</div>':''}</div><div class="actions"><button class="btn review-btn" data-review="${p.이름}">정보·후기 한눈에 보기</button><a class="btn map-btn" href="map.html?수영장=${encodeURIComponent(p.이름)}">지도 위치</a></div></article>`}
function 그리기(){const 목록=수영장.filter(p=>{const 표=시간표.filter(t=>t.수영장ID===p.수영장ID);if(현재필터==='오늘')return 표.some(t=>오늘포함(t.요일구분));if(현재필터==='주말')return 표.some(t=>/토|일|주말|공휴일/.test(t.요일구분));if(현재필터==='공식')return p.정보상태==='공식확인';return true});document.getElementById('count').textContent=`${목록.length}곳`;document.getElementById('pool-list').innerHTML=목록.length?목록.map(카드).join(''):'<div class="empty">이 조건에 맞는 수영장이 아직 없어요.</div>'}
function 언급찾기(글,단어들){const 문장=글.flatMap(x=>깨끗한글(`${x.title}. ${x.description}`).split(/[.!?。]/)).map(x=>x.trim()).filter(x=>x.length>8);return 문장.find(x=>단어들.some(k=>x.includes(k)))||''}
function 사실채우기(id,내용,주의){const 칸=document.getElementById(id);칸.textContent=내용;const 작은글=document.createElement('span');작은글.className='fact-note';작은글.textContent=주의;칸.appendChild(작은글)}
function 상세기본정보(p,표){document.getElementById('detail-schedule').innerHTML=표.length?표.map(t=>`<div class="time-row"><span>${t.요일구분} <small>· ${t.정보상태}</small></span><span>${시간텍스트(t)}</span></div>`).join(''):'<div class="notice">확인된 시간표가 없어요.</div>';document.getElementById('fact-grid').innerHTML=`<div class="fact"><div class="fact-label">이용 요금</div><div class="fact-value">${가격문구(표)}<span class="fact-note">${p.정보상태}</span></div></div><div class="fact"><div class="fact-label">풀 규격</div><div class="fact-value">${p.레인길이m?p.레인길이m+'m':'길이 확인 필요'} · ${p.레인수?p.레인수+'레인':'레인 수 확인 필요'}<span class="fact-note">시설 기본 정보</span></div></div><div class="fact"><div class="fact-label">사람이 얼마나 많은지</div><div class="fact-value" id="crowd-fact">후기에서 찾는 중…<span class="fact-note">카페 후기 참고</span></div></div><div class="fact"><div class="fact-label">샤워실·락커 상태</div><div class="fact-value" id="facility-fact">후기에서 찾는 중…<span class="fact-note">카페 후기 참고</span></div></div>`}
async function 후기열기(이름){const d=document.getElementById('review-dialog'),목록=document.getElementById('review-list'),p=수영장.find(x=>x.이름===이름),표=시간표.filter(t=>t.수영장ID===p.수영장ID);document.getElementById('review-name').textContent=이름;상세기본정보(p,표);목록.innerHTML='<div class="loading">관련 카페 글을 찾고 있어요…</div>';d.showModal();try{const r=await fetch(`/api/cafe-search?q=${encodeURIComponent(`${이름} 자유수영 후기`)}`),본문=await r.text();let data={};try{data=JSON.parse(본문)}catch{}if(!r.ok)throw Error(data.error||'배포된 사이트에서 다시 확인해 주세요.');const 핵심=이름.replace(/\s|수영장/g,'');let 글=(data.items||[]).filter(x=>깨끗한글(x.title+x.description).replace(/\s/g,'').includes(핵심));if(!글.length)글=(data.items||[]).slice(0,5);const 혼잡=언급찾기(글,['사람','혼잡','붐','대기','인원','커트라인','여유']),시설=언급찾기(글,['샤워','락커','사물함','탈의실','드라이기','수건']);사실채우기('crowd-fact',혼잡||'검색 요약문에서 확인되지 않음','후기 요약 · 방문 시점에 따라 달라질 수 있음');사실채우기('facility-fact',시설||'검색 요약문에서 확인되지 않음','후기 요약 · 원문에서 최종 확인');목록.innerHTML=글.length?글.map(x=>`<a class="review" href="${String(x.link||'').startsWith('https://')?x.link:'#'}" target="_blank" rel="noopener"><div class="review-title">${깨끗한글(x.title)}</div><div class="review-desc">${깨끗한글(x.description)}</div><div class="cafe">${깨끗한글(x.cafeName)||'네이버 카페'} ↗</div></a>`).join(''):'<div class="loading">관련 후기를 찾지 못했어요.</div>'}catch(e){사실채우기('crowd-fact','후기를 불러오지 못했어요.','배포된 사이트에서 다시 확인');사실채우기('facility-fact','후기를 불러오지 못했어요.','배포된 사이트에서 다시 확인');목록.innerHTML=`<div class="loading">후기를 불러오지 못했어요.<br><small>${깨끗한글(e.message)}</small></div>`}}
document.querySelector('.filters').onclick=e=>{if(!e.target.matches('.filter'))return;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');현재필터=e.target.dataset.filter;그리기()};document.getElementById('pool-list').onclick=e=>{const b=e.target.closest('[data-review]');if(b)후기열기(b.dataset.review)};document.querySelector('.close').onclick=()=>document.getElementById('review-dialog').close();document.getElementById('review-dialog').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close()};
Promise.all([CSV읽기('수영장.csv'),CSV읽기('자유수영시간.csv')]).then(([p,t])=>{수영장=p;시간표=t;그리기()}).catch(e=>document.getElementById('pool-list').innerHTML=`<div class="empty">데이터를 불러오지 못했어요.<br>${깨끗한글(e.message)}</div>`);
</script></body></html>
