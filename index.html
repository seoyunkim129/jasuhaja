<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>물때 · 오늘 갈 자유수영장</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root{--ink:#24302b;--muted:#6f7b75;--line:#dfe6e1;--paper:#fbfaf6;--mint:#dff2e8;--green:#176b50;--pink:#f5dce5;--yellow:#fff1ba}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR",sans-serif}a{color:inherit}header{position:sticky;top:0;z-index:5;background:#fbfaf6ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{max-width:1120px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px;text-decoration:none}.brand span{color:var(--green)}.map-link{padding:10px 15px;border-radius:999px;background:var(--ink);color:white;text-decoration:none;font-weight:700;font-size:14px}main{max-width:1120px;margin:auto;padding:54px 22px 80px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:28px;align-items:end;margin-bottom:34px}h1{font-size:clamp(36px,6vw,70px);line-height:1.02;letter-spacing:-.055em;margin:0 0 18px}.lead{font-size:18px;line-height:1.7;color:var(--muted);max-width:650px;margin:0}.stamp{background:var(--yellow);padding:22px;border-radius:24px;transform:rotate(2deg);font-weight:800;line-height:1.55}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0}.filter{border:1px solid var(--line);background:white;border-radius:999px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.filter.active{background:var(--green);border-color:var(--green);color:white}.summary{display:flex;justify-content:space-between;align-items:center;margin:18px 0;color:var(--muted)}.summary strong{color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:23px;box-shadow:0 10px 30px #25362d0d}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--mint);color:var(--green);font-size:12px;font-weight:800}.badge.warn{background:var(--yellow);color:#785c00}.badge.call{background:var(--pink);color:#83415b}h2{font-size:23px;letter-spacing:-.035em;margin:12px 0 7px}.type,.address{color:var(--muted);font-size:13px}.address{font-size:14px;margin:15px 0}.times{background:#f5f7f5;border-radius:16px;padding:14px;margin:16px 0;min-height:78px}.time-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:4px 0}.time-row span:last-child{font-weight:800}.price-line{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;font-weight:800;color:var(--green)}.notice{font-size:12px;color:#8a7461;margin-top:8px}.actions{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:13px;padding:12px 10px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}.review-btn{background:var(--green);color:white}.map-btn{background:#eef2ef}.empty{grid-column:1/-1;padding:55px;text-align:center;border:1px dashed #bfc9c2;border-radius:24px;color:var(--muted)}dialog{width:min(860px,calc(100% - 28px));border:0;border-radius:25px;padding:0;box-shadow:0 30px 80px #0004}dialog::backdrop{background:#19231e99}.modal-head{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.modal-head h3{margin:0 0 6px;font-size:23px}.modal-head p{margin:0;color:var(--muted);font-size:13px}.close{border:0;background:#edf1ee;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}.modal-body{padding:22px 24px;max-height:72vh;overflow:auto}.section-title{font-size:15px;margin:0 0 11px}.schedule-box{background:#f5f7f5;border-radius:16px;padding:12px;margin-bottom:16px;overflow-x:auto}.planner{display:grid;grid-template-columns:repeat(8,minmax(94px,1fr));gap:7px;min-width:800px}.planner-day{background:white;border:1px solid var(--line);border-radius:12px;padding:9px;min-height:92px}.planner-day b{display:block;font-size:12px;color:var(--green);margin-bottom:7px}.planner-time{display:block;background:var(--mint);border-radius:7px;padding:5px 4px;margin:4px 0;text-align:center;font-size:11px;font-weight:800}.planner-empty{font-size:11px;color:#a7afaa}.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}.fact{border:1px solid var(--line);border-radius:15px;padding:14px}.fact-label{font-size:11px;font-weight:850;color:var(--green);margin-bottom:7px}.fact-value{font-size:14px;line-height:1.5;font-weight:750}.fact-note{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:5px}.fact.spec{display:block}.spec-row{display:flex;align-items:baseline;gap:7px;margin:5px 0;flex-wrap:wrap}.spec-name{font-size:11px;color:var(--muted);min-width:38px}.spec-value{font-size:14px;font-weight:750}.spec-src{font-size:10px;font-weight:600;padding:1px 7px;border-radius:99px;background:#eef2ef;color:var(--muted)}.spec-src.공식확인{background:var(--mint);color:var(--green)}.spec-src.후기참고{background:var(--yellow);color:#8a6a12}.g-summary{font-size:12px;color:var(--muted);margin:0 0 10px}.g-summary a{color:var(--green)}.topic{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}.topic-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}.topic-name{font-size:13px;font-weight:850}.topic-sum{font-size:11px;color:var(--muted);font-weight:600}.mini-star{font-size:11px;font-weight:800;color:#8a6a12;background:var(--yellow);padding:2px 8px;border-radius:99px}.quote{margin:9px 0 0;padding-left:11px;border-left:3px solid var(--mint)}.quote p{margin:0;font-size:13px;line-height:1.55}.quote-by{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--muted)}.quote-by a{color:var(--muted);text-decoration:underline}.quote-by .avatar{width:17px;height:17px;border-radius:50%;object-fit:cover}.quote-by .dot{opacity:.45}.quote-by .q-star{color:#b07d1a;font-weight:800}.quote-by .q-old{color:#a8763a;font-weight:700}.attr{font-size:11px;color:var(--muted);text-align:right;margin:14px 0 0}.age-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 11px}.age-btn{padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:white;font-family:inherit;font-size:12px;font-weight:750;color:var(--muted);cursor:pointer}.age-btn.on{background:var(--green);border-color:var(--green);color:white}.age-btn:disabled{opacity:.38;cursor:default}.age-note{font-size:11px;color:var(--muted)}.stars{color:#e39a18;letter-spacing:1px;font-size:17px}.score-number{font-size:12px;color:var(--muted);margin-left:5px}.evidence{display:block;margin-top:6px;color:var(--muted);font-size:11px;font-weight:500;line-height:1.45}.reviews{padding:0}.review{display:block;padding:17px 0;border-bottom:1px solid var(--line);text-decoration:none}.review-title{font-weight:850;line-height:1.45}.review-desc{color:var(--muted);font-size:14px;line-height:1.55;margin:7px 0}.cafe{font-size:12px;color:var(--green);font-weight:750}.loading{padding:28px;text-align:center;color:var(--muted)}@media(max-width:720px){.hero{grid-template-columns:1fr}.stamp{display:none}.grid{grid-template-columns:1fr}main{padding-top:35px}.actions{flex-direction:column}.fact-grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="nav"><a class="brand" href="index.html">물<span>때</span></a><a class="map-link" href="map.html">지도에서 보기 →</a></div></header>
<main><section class="hero"><div><h1>오늘 물에<br>들어갈 수 있을까?</h1><p class="lead">마포구 성인 자유수영장을 시간표와 함께 모았어요. 공식 정보와 확인이 필요한 정보는 구분하고, 실제 이용 후기는 네이버 카페에서 바로 찾아봅니다.</p></div><div class="stamp">🏊 원정 자유수영<br>첫 지역 · 마포구</div></section>
<div class="filters"><button class="filter active" data-filter="전체">전체</button><button class="filter" data-filter="오늘">오늘 가능</button><button class="filter" data-filter="주말">주말 가능</button><button class="filter" data-filter="공식">공식 확인</button></div>
<div class="summary"><div><strong id="count">0곳</strong>을 찾았어요</div><small>시간표는 방문 전 다시 확인해 주세요.</small></div><section class="grid" id="pool-list"><div class="empty">수영장 정보를 불러오는 중이에요.</div></section></main>
<dialog id="review-dialog"><div class="modal-head"><div><h3 id="review-name">수영장 정보</h3><p>시간·요금·규격은 출처를 함께 표시합니다. 혼잡·시설·수질은 이용자 후기에서 찾은 말이라 시점에 따라 다를 수 있어요.</p></div><button class="close" aria-label="닫기">×</button></div><div class="modal-body"><h4 class="section-title">자유수영 시간</h4><div class="schedule-box" id="detail-schedule"></div><div class="fact-grid" id="fact-grid"></div><h4 class="section-title">사람들이 한 말</h4><div id="google-reviews"></div><h4 class="section-title">더 많은 이야기 · 네이버 카페</h4><div class="reviews" id="review-list"></div><p class="attr" id="review-attr"></p></div></dialog>
<script>
const 상태문구={공식확인:'공식 시간표 확인',부분확인:'일부 공식 확인',공식시간표미확인:'공식 시간표 미확인'},오늘표현=['일','월','화','수','목','금','토'][new Date().getDay()];let 수영장=[],시간표=[],규격=[],현재필터='전체';
const 깨끗한글=s=>{const e=document.createElement('textarea');e.innerHTML=String(s||'').replace(/<[^>]*>/g,'');return e.value};
function CSV읽기(주소){return fetch(주소,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(`${주소} ${r.status}`);return r.text()}).then(t=>Papa.parse(t,{header:true,skipEmptyLines:true}).data)}
function 규격값(수영장ID,항목){return 규격.find(g=>g.수영장ID===수영장ID&&g.항목===항목&&g.값)}
// 한 줄 요약용. 카드 윗줄에 '25m · 6레인'처럼 짧게 보여줍니다.
function 규격한줄(p){const 길이=규격값(p.수영장ID,'레인길이m'),레인=규격값(p.수영장ID,'레인수');const 조각=[];if(길이)조각.push(길이.값+'m');if(레인)조각.push(레인.값+'레인');return 조각.length?조각.join(' · '):'규격 확인 필요'}
// 상세 화면용. 값마다 어디서 온 정보인지 함께 보여줍니다.
const 규격이름={레인길이m:'길이',레인수:'레인 수',수심m:'수심',물종류:'물'};
const 규격단위={레인길이m:'m',레인수:'레인',수심m:'m',물종류:''};
const 출처문구={공식확인:'공식 확인',후기참고:'후기 출처 · 공식 미확인',확인필요:'출처 미기록'};
function 규격목록(p){return ['레인길이m','레인수','수심m','물종류'].map(항목=>{const g=규격값(p.수영장ID,항목);return g?{이름:규격이름[항목],값:g.값+규격단위[항목],출처:출처문구[g.정보상태]||g.정보상태,상태:g.정보상태}:null}).filter(Boolean)}
// 요일 판정은 적용칸() 하나만 씁니다. 두 벌로 두면 한쪽만 고치고 다른 쪽을 놓칩니다.
function 오늘포함(v){return v?적용칸(v).includes(오늘표현):false}
function 시간텍스트(t){return t.시작시간?`${t.시작시간}–${t.종료시간}`:'운영처 확인 필요'}
function 가격문구(표){const t=표.find(x=>x.비회원가격원||x.회원가격원);if(!t)return '요금 확인 필요';if(t.비회원가격원)return `비회원 ${Number(t.비회원가격원).toLocaleString()}원`;return `회원 ${Number(t.회원가격원).toLocaleString()}원`}
function 카드(p){const 표=시간표.filter(t=>t.수영장ID===p.수영장ID),오늘=표.filter(t=>오늘포함(t.요일구분)),보여줄표=오늘.length?오늘:표.slice(0,3),클래스=p.정보상태==='공식확인'?'':p.정보상태==='부분확인'?'warn':'call';return `<article class="card"><span class="badge ${클래스}">${상태문구[p.정보상태]||p.정보상태}</span><h2>${p.이름}</h2><span class="type">${p.시설구분} · ${규격한줄(p)}</span><p class="address">${p.주소}</p><div class="times">${보여줄표.length?보여줄표.map(t=>`<div class="time-row"><span>${t.요일구분}</span><span>${시간텍스트(t)}</span></div>`).join(''):'<div class="notice">등록된 시간표가 없어요.</div>'}<div class="price-line">${가격문구(표)}</div>${p.정보상태!=='공식확인'?'<div class="notice">⚠ 정확한 시간과 요금은 방문 전에 확인해 주세요.</div>':''}</div><div class="actions"><button class="btn review-btn" data-review="${p.이름}">정보·후기 한눈에 보기</button><a class="btn map-btn" href="map.html?수영장=${encodeURIComponent(p.이름)}">지도 위치</a></div></article>`}
function 그리기(){const 목록=수영장.filter(p=>{const 표=시간표.filter(t=>t.수영장ID===p.수영장ID);if(현재필터==='오늘')return 표.some(t=>오늘포함(t.요일구분));if(현재필터==='주말')return 표.some(t=>/토|일|주말|공휴일/.test(t.요일구분));if(현재필터==='공식')return p.정보상태==='공식확인';return true});document.getElementById('count').textContent=`${목록.length}곳`;document.getElementById('pool-list').innerHTML=목록.length?목록.map(카드).join(''):'<div class="empty">이 조건에 맞는 수영장이 아직 없어요.</div>'}
function 사실채우기(id,내용,주의){const 칸=document.getElementById(id);칸.textContent=내용;const 작은글=document.createElement('span');작은글.className='fact-note';작은글.textContent=주의;칸.appendChild(작은글)}
// 시간표의 요일구분 표기('월~금', '토·공휴일' 등)를 플래너 칸 이름으로 바꿉니다.
// 주의: '공휴일'과 '평일'에도 '일' 글자가 들어 있습니다. 먼저 이 낱말들을 떼어낸 뒤에
// 요일 글자를 찾아야 '토·공휴일'이 일요일 칸에 잘못 들어가지 않습니다.
function 적용칸(표기){
  const 칸=[];
  if(표기.includes('평일')||표기.includes('월~금')) 칸.push('월','화','수','목','금');
  if(표기.includes('주말')) 칸.push('토','일');
  const 낱요일=표기.replace(/공휴일/g,'').replace(/평일/g,'').replace(/주말/g,'').replace(/월~금/g,'');
  ['월','화','수','목','금','토','일'].forEach(d=>{if(낱요일.includes(d)&&!칸.includes(d))칸.push(d)});
  if(표기.includes('공휴일')) 칸.push('공휴일');
  return 칸;
}
function 플래너HTML(표){const 칸들=['월','화','수','목','금','토','일','공휴일'];return `<div class="planner">${칸들.map(d=>{const 회차=표.filter(t=>적용칸(t.요일구분).includes(d)),이름=d==='공휴일'?'공휴일':`${d}요일`;return `<div class="planner-day"><b>${이름}</b>${회차.length?회차.map(t=>`<span class="planner-time">${시간텍스트(t)}</span>`).join(''):'<span class="planner-empty">확인된 회차 없음</span>'}</div>`}).join('')}</div>`}
function 상세기본정보(p,표){document.getElementById('detail-schedule').innerHTML=표.length?플래너HTML(표):'<div class="notice">확인된 시간표가 없어요.</div>';document.getElementById('fact-grid').innerHTML=`<div class="fact"><div class="fact-label">이용 요금</div><div class="fact-value">${가격문구(표)}<span class="fact-note">${p.정보상태}</span></div></div><div class="fact spec"><div class="fact-label">풀 규격</div>${규격목록(p).length?규격목록(p).map(g=>`<div class="spec-row"><span class="spec-name">${g.이름}</span><span class="spec-value">${g.값}</span><span class="spec-src ${g.상태}">${g.출처}</span></div>`).join(''):'<div class="fact-value">규격 확인 필요</div>'}</div>`}

function 시설일치(글,이름){const 핵심=이름.replace(/\s|수영장/g,'');return (글||[]).filter(x=>깨끗한글(x.title).replace(/\s|수영장/g,'').includes(핵심))}
async function 검색요청(q){const r=await fetch(`/api/cafe-search?q=${encodeURIComponent(q)}`),본문=await r.text();let data={};try{data=JSON.parse(본문)}catch{}if(!r.ok)throw Error(data.error||'배포된 사이트에서 다시 확인해 주세요.');return data.items||[]}

/* ══════════════════════════════════════════════════════════════
   후기 분류 - 고칠 일이 있으면 아래 '후기주제' 표만 보면 됩니다.

   하는 일: 리뷰 한 편을 문장으로 쪼개고, 문장마다 어느 주제인지 붙입니다.
   별점을 매기지 않고 문장을 그대로 보여주므로, 분류가 틀려도 화면을 보면
   바로 드러납니다. 어느 주제에도 안 걸린 문장은 버리지 않고 '기타'로 갑니다.

   요금과 수심은 여기에 없습니다. 정답이 하나 있는 값이라 공식 정보로 다룹니다.
   ══════════════════════════════════════════════════════════════ */
const 후기주제=[
  {키:'crowd',이름:'혼잡',아이콘:'🚦',
   핵심:['사람이 많','사람 많','사람이 적','붐비','혼잡','북적','우글','커트라인','정원',
         '인원수','입장이 되지','꽉 차','자리가 없','한산','널널','줄을 서','대기 줄'],
   보조:['대기','마감','여유','시끌','조용']},
  {키:'facility',이름:'시설·샤워실',아이콘:'🚿',
   핵심:['샤워','탈의실','락커','락카','사물함','드라이기','탈수기','화장실',
         '청결','깨끗','깔끔','더럽','낡','노후','리모델링','곰팡','냄새','시설'],
   보조:['수건','선반','주차','쾌적','좁']},
  {키:'water',이름:'물·수질',아이콘:'🌊',
   // '물이','물은' 같은 말은 '건물은', '인물이'에도 걸리므로 쓰지 않습니다.
   // 앞뒤 글자를 붙여 뜻이 분명한 말만 씁니다.
   핵심:['수질','물 깨끗','물이 깨끗','물이 더','물때','해수','담수','수온','미온수',
         '염소','뿌옇','물이 차','물이 뜨','미지근','물속'],
   보조:['수심','레인','차갑','뜨겁']},
];
// 소수점을 마침표로 착각하지 않게 잠시 바꿔두고 쪼갭니다.
// ('수심은 1.15m' 가 '수심은 1' 에서 끊기던 문제)
function 문장쪼개기(글){
  const 보호=String(글||'').replace(/(\d)\.(\d)/g,'$1\u0001$2');
  return 보호.split(/[.!?。\n]+/).map(x=>x.replace(/\u0001/g,'.').trim()).filter(x=>x.length>=8);
}
// 핵심 말이 걸리면 2점, 보조 말만 걸리면 1점. 점수가 높은 문장을 먼저 보여줍니다.
function 주제점수(문장,주제){
  if(주제.핵심.some(w=>문장.includes(w))) return 2;
  if(주제.보조.some(w=>문장.includes(w))) return 1;
  return 0;
}
// 마포아트센터는 구글에 '문화센터', 월드컵스파랜드24는 '스파'로 등록돼 있어
// 공연·찜질방 리뷰가 섞입니다. 그런 시설은 수영 이야기가 있는 리뷰만 씁니다.
const 수영말=['수영','자유수영','자수','레인','풀장','물놀이','입수'];
function 수영리뷰만(리뷰들,필터){
  if(필터!=='수영언급만') return 리뷰들;
  return 리뷰들.filter(r=>수영말.some(w=>String(r.본문||'').includes(w)));
}
// 리뷰 목록 → {주제키: [{문장, 리뷰, 점수}]}
function 후기묶기(리뷰들){
  const 묶음={기타:[]};
  후기주제.forEach(t=>묶음[t.키]=[]);
  for(const r of 리뷰들){
    const 문장들=문장쪼개기(r.본문);
    for(const 문장 of 문장들){
      let 걸림=false;
      for(const t of 후기주제){
        const 점수=주제점수(문장,t);
        if(점수){ 묶음[t.키].push({문장,리뷰:r,점수}); 걸림=true; }
      }
      if(!걸림 && 문장.length>=20) 묶음.기타.push({문장,리뷰:r,점수:0});
    }
    if(!문장들.length && r.본문.trim()) 묶음.기타.push({문장:r.본문.trim(),리뷰:r,점수:0});
  }
  // 핵심 말이 걸린 문장이 위로 오게 정렬합니다
  Object.values(묶음).forEach(목록=>목록.sort((a,b)=>b.점수-a.점수));
  return 묶음;
}

/* 구글 정책상 리뷰를 보여줄 때 작성자(사진·이름·프로필)와 원본 링크를
   반드시 함께 표시해야 합니다. 아래 두 함수가 그 표시를 담당합니다. */
// 구글은 리뷰를 최신순으로 달라고 요청할 방법을 주지 않습니다.
// (예전 API의 reviews_sort=newest는 신규 프로젝트에서 켤 수 없습니다)
// 그래서 받아온 5개 안에서 직접 나이를 재고 정렬·거르기를 합니다.
function 후기나이년(r){
  const t=Date.parse(r.작성시각||'');
  if(!t) return 99;
  return (Date.now()-t)/(365.25*24*3600*1000);
}
function 최신순(리뷰들){return [...리뷰들].sort((a,b)=>후기나이년(a)-후기나이년(b))}
function 안전링크(u){return /^https?:\/\//.test(String(u||''))?u:''}
function 인용HTML(항목){
  const r=항목.리뷰, 프로필=안전링크(r.작성자링크), 원본=안전링크(r.원본링크), 사진=안전링크(r.작성자사진);
  const 오래됨=/년 전/.test(r.시점)&&Number((r.시점.match(/(\d+)년/)||[])[1]||0)>=3;
  return `<div class="quote"><p>${깨끗한글(항목.문장)}</p><div class="quote-by">`
    +(사진?`<img class="avatar" src="${사진}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'')
    +(프로필?`<a href="${프로필}" target="_blank" rel="noopener nofollow">${깨끗한글(r.작성자)||'구글 사용자'}</a>`
            :`<span>${깨끗한글(r.작성자)||'구글 사용자'}</span>`)
    +`<span class="dot">·</span><span class="q-star">★${r.별점??'-'}</span>`
    +`<span class="dot">·</span><span class="${오래됨?'q-old':''}">${깨끗한글(r.시점)}${오래됨?' · 오래된 후기':''}</span>`
    +(원본?`<span class="dot">·</span><a href="${원본}" target="_blank" rel="noopener nofollow">원본 ↗</a>`:'')
    +`</div></div>`;
}
function 후기HTML(자료,필터,기간){
  const 수영거른=수영리뷰만(자료.리뷰||[],필터);
  const 쓸리뷰=최신순(기간?수영거른.filter(r=>후기나이년(r)<=기간):수영거른);
  const 묶음=후기묶기(쓸리뷰);
  const 칸들=[];
  for(const t of 후기주제){
    const 목록=묶음[t.키]; if(!목록.length) continue;
    const 별점들=목록.map(x=>x.리뷰.별점).filter(v=>typeof v==='number');
    const 사람수=new Set(목록.map(x=>x.리뷰.작성자+x.리뷰.시점)).size;
    const 평균=별점들.length?(별점들.reduce((a,b)=>a+b,0)/별점들.length):null;
    const 뱃지=사람수>=3&&평균!=null?`<span class="mini-star">★ ${평균.toFixed(1)} · ${사람수}명</span>`
                                    :`<span class="topic-sum">근거 ${사람수}개 · 참고만 하세요</span>`;
    칸들.push(`<div class="topic"><div class="topic-head"><span class="topic-name">${t.아이콘} ${t.이름}</span>${뱃지}</div>`
      +목록.slice(0,3).map(인용HTML).join('')+`</div>`);
  }
  if(묶음.기타.length){
    칸들.push(`<div class="topic"><div class="topic-head"><span class="topic-name">💬 기타</span>`
      +`<span class="topic-sum">위 항목에 안 들어가는 이야기</span></div>`
      +묶음.기타.slice(0,3).map(인용HTML).join('')+`</div>`);
  }
  const 링크=안전링크(자료.장소링크);
  // 기간 버튼. 이미 받아온 자료를 다시 그리는 것이라 API를 또 부르지 않습니다.
  const 버튼들=[[0,'전체'],[3,'3년'],[2,'2년'],[1,'1년']].map(([년,이름])=>{
    const 남음=(년?수영거른.filter(r=>후기나이년(r)<=년):수영거른).length;
    return `<button class="age-btn${기간===년?' on':''}" data-age="${년}"${남음?'':' disabled'}>${이름} ${남음}</button>`;
  }).join('');
  const 머리=`<p class="g-summary">${자료.전체평점!=null?`구글 지도 평점 <b>${자료.전체평점}</b> · 리뷰 ${Number(자료.전체리뷰수||0).toLocaleString()}개`:''}`
    +`${링크?` · <a href="${링크}" target="_blank" rel="noopener nofollow">지도에서 보기 ↗</a>`:''}</p>`
    +`<div class="age-row">${버튼들}<span class="age-note">구글이 고른 5개 중에서 고릅니다</span></div>`;
  if(!칸들.length) return 머리+'<div class="loading">이 기간에는 후기가 없어요. 기간을 넓혀 보세요.</div>';
  return 머리+칸들.join('');
}
async function 구글후기요청(placeId){
  const r=await fetch(`/api/google-reviews?placeId=${encodeURIComponent(placeId)}`);
  const 본문=await r.text(); let d={};
  try{d=JSON.parse(본문)}catch{}
  if(!r.ok)throw Error(d.error||'구글 리뷰를 불러오지 못했어요.');
  return d;
}

let 현재구글=null;
function 구글다시그리기(){
  if(!현재구글) return;
  document.getElementById('google-reviews').innerHTML=후기HTML(현재구글.자료,현재구글.필터,현재구글.기간);
}
// 기간 버튼은 다시 그릴 때마다 새로 생기므로 바깥 상자에서 한 번만 받습니다.
document.getElementById('google-reviews').addEventListener('click',e=>{
  const b=e.target.closest('.age-btn'); if(!b||!현재구글) return;
  현재구글.기간=Number(b.dataset.age);
  구글다시그리기();
});
async function 후기열기(이름){
  const d=document.getElementById('review-dialog'),
        카페칸=document.getElementById('review-list'),
        구글칸=document.getElementById('google-reviews'),
        표기칸=document.getElementById('review-attr'),
        p=수영장.find(x=>x.이름===이름),
        표=시간표.filter(t=>t.수영장ID===p.수영장ID);
  document.getElementById('review-name').textContent=이름;
  상세기본정보(p,표);
  현재구글=null;
  구글칸.innerHTML='<div class="loading">후기를 읽는 중이에요…</div>';
  카페칸.innerHTML='<div class="loading">네이버 카페 글을 찾는 중이에요…</div>';
  표기칸.textContent='';
  d.showModal();

  // 구글과 네이버는 서로 독립이라 한쪽이 실패해도 다른 쪽은 보여줍니다.
  if(p.구글PlaceID){
    구글후기요청(p.구글PlaceID)
      .then(자료=>{현재구글={자료,필터:p.구글리뷰필터,기간:0};구글다시그리기();표기칸.textContent='후기 데이터 · Google Maps'})
      .catch(e=>{구글칸.innerHTML=`<div class="loading">후기를 불러오지 못했어요.<br><small>${깨끗한글(e.message)}</small></div>`});
  }else{
    구글칸.innerHTML='<div class="loading">이 시설은 구글 지도에 등록돼 있지 않아 후기를 찾을 수 없어요.</div>';
  }

  try{
    const 검색어들=[`${이름} 자유수영 후기`,`${이름} 자수 후기`,`${이름} 수영장 후기`],
          결과들=await Promise.all(검색어들.map(검색요청)),
          관련글=시설일치(결과들.flat(),이름),
          중복제거=[...new Map(관련글.map(x=>[x.link,x])).values()],
          보여줄글=중복제거.slice(0,12);
    카페칸.innerHTML=보여줄글.length
      ?보여줄글.map(x=>`<a class="review" href="${String(x.link||'').startsWith('https://')?x.link:'#'}" target="_blank" rel="noopener"><div class="review-title">${깨끗한글(x.title)}</div><div class="review-desc">${깨끗한글(x.description)}</div><div class="cafe">${깨끗한글(x.cafeName)||'네이버 카페'} ↗</div></a>`).join('')
      :'<div class="loading">관련 카페 글을 찾지 못했어요.</div>';
  }catch(e){
    카페칸.innerHTML=`<div class="loading">카페 글을 불러오지 못했어요.<br><small>${깨끗한글(e.message)}</small></div>`;
  }
}

document.querySelector('.filters').onclick=e=>{if(!e.target.matches('.filter'))return;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');현재필터=e.target.dataset.filter;그리기()};document.getElementById('pool-list').onclick=e=>{const b=e.target.closest('[data-review]');if(b)후기열기(b.dataset.review)};document.querySelector('.close').onclick=()=>document.getElementById('review-dialog').close();document.getElementById('review-dialog').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close()};
Promise.all([CSV읽기('수영장.csv'),CSV읽기('자유수영시간.csv'),CSV읽기('시설규격.csv')]).then(([p,t,g])=>{수영장=p;시간표=t;규격=g;그리기()}).catch(e=>document.getElementById('pool-list').innerHTML=`<div class="empty">데이터를 불러오지 못했어요.<br>${깨끗한글(e.message)}</div>`);
</script></body></html>
