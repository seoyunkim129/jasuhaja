<!-- TMAP 앱키. 이 파일은 .gitignore에 걸려 있어서 깃허브에 안 올라갑니다.

<script src="tmap-key.js"></script>

<!-- TMAP 지도 파일 불러오기.
     ⚠️ 이 파일은 스스로 document.write로 부품들을 더 불러옵니다.
     그래서 JS로 "나중에" 붙이면 브라우저가 막아버립니다.
     (에러: Failed to execute 'write' on 'Document' ...)
     이렇게 문서를 읽는 도중에 끼워 넣어야 정상 동작합니다. -->
<script>
if (typeof TMAP키 !== 'undefined' && TMAP키) {
  document.write(
    '<scr' + 'ipt src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey='
    + encodeURIComponent(TMAP키) + '"><\/scr' + 'ipt>'
  );
}
</script>

<script>
/* ============================================================
   ① TMAP 키
   키는 이 파일이 아니라 옆에 있는 tmap-key.js 에 적습니다.
   그 파일은 .gitignore에 걸려 있어서 깃허브에 안 올라갑니다.
   키가 없으면 지도 대신 안내가 뜹니다 (필터와 개수는 그래도 동작합니다).
   ============================================================ */
const 키 = (typeof TMAP키 === 'undefined') ? "" : TMAP키;

/* ============================================================
   ② 지도 준비됐는지 확인하고 시작하기
   지도 파일 자체는 위(head 쪽)에서 이미 불러왔습니다.
   여기서는 다 불러와졌는지 확인만 하고 지도를 만듭니다.
   ============================================================ */
let 지도 = null;
let 정보창 = null;

window.addEventListener('load', () => {
  시설칩그리기();          // 지도 키가 없어도 시설 목록은 보여줍니다
  if (!키){ 안내띄우기(); return; }

  // Tmapv2가 제대로 안 만들어졌으면 키나 인터넷 문제입니다
  if (typeof Tmapv2 === 'undefined' || !Tmapv2.Map){
    안내띄우기("지도 파일을 못 불러왔습니다. 앱키가 맞는지, 인터넷이 되는지 확인해 주세요.");
    return;
  }
  지도만들기();
});

function 안내띄우기(오류){
  document.getElementById('map_div').outerHTML = `
    <div class="guide" id="map_div">
      <h2>${오류 ? '지도를 불러오지 못했습니다' : 'TMAP 키를 넣어주세요'}</h2>
      <p>${오류 || '키가 있어야 진짜 지도가 뜹니다. 아래 순서대로 하면 됩니다.'}</p>
      <ol>
        <li><a href="https://openapi.sk.com/" target="_blank" rel="noopener">openapi.sk.com</a> 가입</li>
        <li>대시보드에서 앱(App) 만들기 (이름은 아무거나, 예: multtae)</li>
        <li>그 앱에 <b>TMAP</b> 상품 신청 (Free 등급)</li>
        <li>받은 appKey를 옆에 있는 <code>tmap-key.js</code> 파일 안에 붙여넣고 새로고침</li>
      </ol>
    </div>`;
}

function 지도만들기(){
  지도 = new Tmapv2.Map("map_div", {
    center: new Tmapv2.LatLng(37.5480, 126.8520),   // 강서·양천 가운데쯤
    width:  "100%",
    height: window.innerWidth < 760 ? "380px" : "520px",
    zoom:   13
  });
  다시그리기();      // 지도가 준비된 뒤에 단지 점을 찍습니다
  주변시설찾기();    // TMAP에서 진짜 수영장·다이소를 찾아옵니다
}

/* ============================================================
   ②-2 수영장 · 다이소 찾아오기 (TMAP 주변 POI 검색)
   여기서 나오는 위치는 가데이터가 아니라 진짜입니다.

   ⚠️ 주의: 이 API는 searchKeyword가 아니라 categories로 걸러야 합니다.
   searchKeyword를 넣으면 무시되고 반경 안의 모든 것이 나옵니다.

   호출 2번 = 하루 한도 20,000 중 2건. 넉넉합니다.
   ============================================================ */
let 시설마커 = [];

// 이름에 이런 게 붙은 건 시설 본체가 아니라 부속입니다 (예: "다이소 발산역점 주차장")
const 부속 = /주차장|정문|후문|출입구|입구$/;

// TMAP "수영장" 분류에는 유아·어린이 전용 강습장이 섞여 나옵니다.
// (오션키즈, 키즈돌핀, 오션차일드, 국가대표어린이수영클럽 ...)
// 어른이 수영하러 갈 수 있는 곳이 아니라서 수영장으로 치지 않습니다.
// 성인 강습장(블루라군, 스위밍고, 스윔랩 ...)은 일부러 남겨둡니다.
const 유아전용 = /키즈|어린이|유아|아동|주니어|차일드|kids/i;

// 아직 문을 안 연 곳 (예: "신기스포렉스 공사중(2027년07월오픈예정)")
const 미개장 = /공사중|오픈예정|개장예정|준비중/;

// 여름에만 여는 야외 물놀이장은 수영장이 아닙니다 (예: "서서울호수공원물놀이장")
const 물놀이장 = /물놀이장|워터파크/;

// 법인 등록명으로 잡힌 것 (예: "주식회사 엠에이치씨스포츠") - 실제 시설인지 확인이 안 됩니다
const 법인명 = /주식회사|㈜|\(주\)/;

// 위 네 가지 중 하나라도 걸리면 수영장으로 치지 않습니다
function 수영장아님(이름){
  return 유아전용.test(이름) || 미개장.test(이름) || 물놀이장.test(이름) || 법인명.test(이름);
}

async function 카테고리검색(카테고리, 중심, 반경km){
  const 주소 = 'https://apis.openapi.sk.com/tmap/pois/search/around?version=1'
    + '&categories=' + encodeURIComponent(카테고리)
    + '&centerLat=' + 중심.lat() + '&centerLon=' + 중심.lng()
    + '&radius=' + 반경km + '&count=50'
    + '&resCoordType=WGS84GEO&reqCoordType=WGS84GEO&appKey=' + 키;

  const 응답 = await fetch(주소);
  if (!응답.ok) throw new Error(카테고리 + ' 검색 실패: ' + 응답.status);

  const 결과 = await 응답.json();
  const 목록 = (결과.searchPoiInfo && 결과.searchPoiInfo.pois && 결과.searchPoiInfo.pois.poi) || [];

  // 부속 POI를 빼고, 같은 자리에 겹치는 것도 하나만 남깁니다
  const 본 = new Set();
  return 목록.filter(p => {
    if (부속.test(p.name)) return false;
    if (카테고리 === '수영장' && 수영장아님(p.name)) return false;
    const 자리 = p.frontLat + ',' + p.frontLon;
    if (본.has(자리)) return false;
    본.add(자리);
    return true;
  });
}

async function 주변시설찾기(){
  const 중심   = 지도.getCenter();
  const 시설들 = 시설목록();

  try {
    // 시설마다 TMAP에 한 번씩 물어봅니다.
    // Promise.all로 한꺼번에 보내야 시설이 늘어도 기다리는 시간이 안 늘어납니다.
    // 하나가 실패해도 나머지는 보이도록 각각 catch로 감쌉니다.
    const 결과들 = await Promise.all(
      시설들.map(시설 => 카테고리검색(시설.이름, 중심, 5).catch(() => []))
    );

    시설마커.forEach(m => m.setMap(null));
    시설마커 = [];

    시설들.forEach((시설, 번호) => {
      결과들[번호].forEach(p => {
        const 마커 = new Tmapv2.Marker({
          position: new Tmapv2.LatLng(Number(p.frontLat), Number(p.frontLon)),
          icon:     아이콘마커(시설, 30),
          iconSize: new Tmapv2.Size(30, 40),
          offset:   new Tmapv2.Point(15, 40),   // 핀 아래 뾰족한 끝을 실제 위치에 맞춥니다
          zIndex:   100,                        // 시설을 단지보다 위에 그립니다
          title:    p.name,
          map:      지도
        });
        마커.addListener("click", () => 시설정보창(p, 시설));
        시설마커.push(마커);
      });
    });

    console.log('TMAP에서 찾음 - ' +
      시설들.map((시설, 번호) => 시설.이름 + ' ' + 결과들[번호].length + '곳').join(', '));
  } catch (e) {
    console.warn('주변 시설을 못 불러왔습니다:', e.message);
  }
}

/* ============================================================
   ③ 데이터 불러오기 (index.html ⑩과 같습니다)
   ============================================================ */

/* ============================================================
   ④ 조건에 맞는 단지 고르기 (index.html ⑫와 똑같습니다 - 일부러 그대로 뒀습니다)
   ============================================================ */
function 조건통과(단지){
  const 검색어 = document.getElementById('검색어').value.trim();
  const 유형   = document.getElementById('유형').value;
  const 자치구 = document.getElementById('자치구').value;

  if (Number(단지.수영장도보분) > 선택한시간) return false;   // 수영장 조건
  if (Number(단지.다이소도보분) > 선택한시간) return false;   // 다이소 조건
  if (유형   !== '전체' && 단지.유형   !== 유형)   return false;
  if (자치구 !== '전체' && 단지.자치구 !== 자치구) return false;
  if (검색어 && !단지.단지명.includes(검색어))    return false;
  return true;
}

/* ============================================================
   ⑤ 마커 그리기
   SVG 지도와 가장 다른 점: 마커는 innerHTML로 못 지웁니다.
   전에 만든 마커를 하나씩 setMap(null)로 떼어낸 뒤 새로 만들어야 합니다.
   그 줄이 빠지면 버튼을 누를 때마다 마커가 계속 쌓입니다.
   ============================================================ */
let 마커들 = [];

// 동그란 점 하나를 그림 파일 없이 글자로 만들어 씁니다 (data URI)
function 점모양(색, 지름){
  const 반지름 = 지름/2;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + 지름 + '" height="' + 지름 + '">'
            + '<circle cx="' + 반지름 + '" cy="' + 반지름 + '" r="' + (반지름-2) + '" '
            + 'fill="' + 색 + '" stroke="#052E38" stroke-width="2"/></svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* ============================================================
   ⑤-1 시설 목록
   전에는 수영장·다이소가 코드에 박혀 있었습니다.
   이제 목록으로 두고, 사용자가 화면에서 더할 수 있게 합니다.
   ============================================================ */
const 기본시설 = [
  { 이름:'수영장', 색:'#3FD8C4', 그림:'수영'   },
  { 이름:'다이소', 색:'#F5A623', 그림:'쇼핑백' }
];

// 사용자가 추가한 시설에 차례로 물려줄 색입니다
const 추가색 = ['#7FB3FF', '#C792EA', '#7BD88F', '#FF9E9E', '#FFD166', '#5FD3E8'];

// 사용자가 추가한 시설은 이 브라우저에 저장해서 새로고침해도 남게 합니다
function 저장된시설(){
  try { return JSON.parse(localStorage.getItem('물때시설') || '[]'); }
  catch(e){ return []; }   // 저장이 막힌 브라우저(시크릿 창 등)에서도 안 죽게
}

function 시설목록(){
  return 기본시설.concat(저장된시설());
}

// 저장이 막힌 브라우저(시크릿 창 등)에서도 화면이 안 죽게 감쌉니다
function 시설저장(목록){
  try { localStorage.setItem('물때시설', JSON.stringify(목록)); }
  catch(e){ console.warn('시설을 저장하지 못했습니다. 새로고침하면 사라집니다.'); }
}

// 시설 이름을 칩(둥근 딱지)으로 보여줍니다. 기본 시설은 뺄 수 없습니다.
function 시설칩그리기(){
  document.getElementById('시설칩들').innerHTML =
    시설목록().map((시설, 번호) => {
      const 기본 = 번호 < 기본시설.length;
      return '<span class="칩">' +
        '<img src="' + 아이콘마커(시설, 14) + '" width="14" height="18" alt="">' +
        시설.이름 +
        (기본 ? '' : '<button title="빼기" onclick="시설빼기(' + (번호 - 기본시설.length) + ')">&times;</button>') +
      '</span>';
    }).join('');
}

function 시설더하기(){
  const 칸   = document.getElementById('시설추가');
  const 이름 = 칸.value.trim();
  if (!이름) return;

  const 지금 = 시설목록();
  if (지금.some(f => f.이름 === 이름)){ alert('이미 있습니다: ' + 이름); return; }
  // 시설이 늘면 지도를 열 때마다 그 수만큼 TMAP에 물어봅니다. 6개까지만 받습니다.
  if (지금.length >= 6){ alert('시설은 6개까지만 넣을 수 있어요. 하나 빼고 다시 넣어주세요.'); return; }

  const 저장 = 저장된시설();
  저장.push({ 이름: 이름, 색: 추가색[저장.length % 추가색.length], 그림: null });
  시설저장(저장);

  칸.value = '';
  시설칩그리기();
  if (지도) 주변시설찾기();
}

function 시설빼기(번호){
  const 저장 = 저장된시설();
  저장.splice(번호, 1);
  시설저장(저장);
  시설칩그리기();
  if (지도) 주변시설찾기();
}

/* ============================================================
   ⑤-2 아이콘 마커
   그림 파일을 따로 두지 않고 SVG를 글자로 만들어 씁니다 (data URI).
   Vercel에 올릴 때 챙길 파일이 안 늘어납니다.

   그림은 24x24 칸 안에 그린다고 생각하고 그립니다.
   ============================================================ */
const 그림모음 = {
  수영:   '<circle cx="15.8" cy="7" r="2.2" fill="currentColor" stroke="none"/>'
        + '<path d="M3 13.6l5.2-2.9 4.6 2.6 4.4-4.1 3.8 2.2"/>'
        + '<path d="M2 19c2.5-2.4 5-2.4 7.5 0s5.5 2.4 8 0"/>',
  쇼핑백: '<path d="M5 8h14l-1.2 13H6.2L5 8Z"/>'
        + '<path d="M9 10V6.8a3 3 0 0 1 6 0V10"/>',
  집:     '<path d="M3.5 10.5 12 4l8.5 6.5V21H3.5V10.5Z"/>'
        + '<path d="M9.6 21v-5.4h4.8V21"/>'
};

// 그림이 없는 시설은 이름 앞글자를 씁니다 (GS25 → GS, 스타벅스 → 스)
function 앞글자(이름){
  return /^[A-Za-z]/.test(이름) ? 이름.slice(0,2).toUpperCase() : 이름.slice(0,1);
}

// 핀 하나를 그림 주소로 만들어 돌려줍니다
function 아이콘마커(시설, 크기){
  const 세로   = Math.round(크기 * 1.32);   // 핀은 세로로 길쭉합니다
  const 그림   = 그림모음[시설.그림];

  // 그림이 있으면 그림을, 없으면 앞글자를 가운데에 놓습니다
  const 가운데 = 그림
    ? '<g transform="translate(8.6 8.6) scale(0.62)" fill="none" stroke="' + 시설.색 + '" '
      + 'color="' + 시설.색 + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'
      + 그림 + '</g>'
    : '<text x="16" y="16" dy=".36em" text-anchor="middle" fill="' + 시설.색 + '" '
      + 'font-family="Malgun Gothic, sans-serif" font-size="10.5" font-weight="700">'
      + 앞글자(시설.이름) + '</text>';

  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + 크기 + '" height="' + 세로 + '" viewBox="0 0 32 42">'
    // ① 핀 몸통. 아래 뾰족한 끝이 실제 위치를 가리킵니다.
    //    테두리를 흰색으로 둬야 마커끼리 겹쳐도 경계가 보입니다.
    + '<path d="M16 41C16 41 29 26 29 16A13 13 0 1 0 3 16C3 26 16 41 16 41Z" '
    +       'fill="' + 시설.색 + '" stroke="#FFFFFF" stroke-width="2.5"/>'
    // ② 흰 동그라미. 그림이 핀 색에 묻히지 않게 받쳐줍니다.
    + '<circle cx="16" cy="16" r="9.6" fill="#FFFFFF"/>'
    + 가운데
    + '</svg>';

  // '#'을 그대로 두면 브라우저가 그 뒤를 주소의 조각으로 보고 그림을 잘라먹습니다
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

function 정보창닫기(){
  if (!정보창) return;
  try { 정보창.setMap(null); } catch(e){ try { 정보창.setVisible(false); } catch(e2){} }
  정보창 = null;
}

    '<div style="background:#0B5C6B;color:#E9F3F2;border:1px solid rgba(63,216,196,.4);' +
    'border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;' +
    'font-family:Malgun Gothic,sans-serif;min-width:190px">' +

// 수영장·다이소를 눌렀을 때 - 이건 TMAP에서 온 진짜 정보입니다
/* 네이버 지도 장소 검색 링크.
   API 키가 필요 없고, 리뷰·길찾기·영업시간을 네이버가 다 보여줍니다.
   덕분에 도보 시간을 우리가 계산할 이유가 없어졌습니다.

   좌표(?c=...)는 일부러 안 붙입니다. 문서에 없는 값이라
   네이버가 바꾸면 조용히 깨집니다. 이름으로 찾는 게 더 안전합니다. */
function 네이버지도주소(검색어){
  return 'https://map.naver.com/p/search/' + encodeURIComponent(검색어.trim());
}

function 시설정보창(p, 시설){
  const 종류 = 시설.이름, 색 = 시설.색;
  정보창닫기();
  const 주소 = [p.upperAddrName, p.middleAddrName, p.lowerAddrName, p.roadName].filter(Boolean).join(' ');
  const 내용 =
    '<div style="background:#0B5C6B;color:#E9F3F2;border:1px solid ' + 색 + ';' +
    'border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.5;' +
    'font-family:Malgun Gothic,sans-serif;min-width:215px">' +
      '<span style="font-size:10px;letter-spacing:.1em;color:' + 색 + '">' + 종류 + '</span><br>' +
      '<b style="font-size:14px">' + p.name + '</b><br>' +
      '<span style="color:#8FB3B8;font-size:12px">' + 주소 + '</span><br>' +
      '<a href="' + 네이버지도주소(p.name + ' ' + (p.middleAddrName || '')) + '" ' +
        'target="_blank" rel="noopener noreferrer" ' +
        'style="color:' + 색 + ';font-weight:700;display:inline-block;margin-top:8px">' +
        '네이버 지도에서 보기 (리뷰 · 길찾기) →</a>' +
    '</div>';

  정보창 = new Tmapv2.InfoWindow({
    position: new Tmapv2.LatLng(Number(p.frontLat), Number(p.frontLon)),
    content: 내용,
    type: 2,
    border: "0px",
    background: false,
    map: 지도
  });
}

function 다시그리기(){
  const 검색어 = document.getElementById('검색어').value.trim();
  const 통과   = 전체단지.filter(조건통과);

  document.getElementById('개수').textContent = 통과.length;

  // 지도가 아직 없으면(키 없음 / 불러오는 중) 개수까지만 갱신하고 끝냅니다
  if (!지도) return;

  정보창닫기();
  마커들.forEach(m => m.setMap(null));   // ← 이 줄이 핵심
  마커들 = [];

  전체단지.forEach(d => {
    const 통과함 = 통과.includes(d);
    const 지름   = 통과함 ? 22 : 13;
    const 마커 = new Tmapv2.Marker({
      position: new Tmapv2.LatLng(Number(d.위도), Number(d.경도)),
      icon:     점모양(통과함 ? '#F5A623' : 'rgba(143,179,184,.55)', 지름),
      iconSize: new Tmapv2.Size(지름, 지름),
      title:    d.단지명,
      map:      지도
    });
    마커.addListener("click", () => 정보창열기(d));
    마커들.push(마커);
  });

  // 검색어가 있으면 처음 찾은 단지로 지도를 옮겨줍니다
  if (검색어){
    const 첫번째 = 전체단지.find(d => d.단지명.includes(검색어));
    if (첫번째){
      지도.setCenter(new Tmapv2.LatLng(Number(첫번째.위도), Number(첫번째.경도)));
      지도.setZoom(15);
    }
  }
}

   ⑥ 버튼 동작 (index.html ⑬과 같습니다)

function 시간바꾸기(누른버튼, 분){
  document.querySelectorAll('.min-btn').forEach(b => b.classList.remove('on'));
  누른버튼.classList.add('on');
  선택한시간 = 분;
  다시그리기();
}
