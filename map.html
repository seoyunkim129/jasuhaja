<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자수하자 · 마포·양천 자유수영 지도</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script src="tmap-key.js"></script><script>if(typeof TMAP키!=='undefined'&&TMAP키)document.write('<scr'+'ipt src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey='+encodeURIComponent(TMAP키)+'"><\/scr'+'ipt>')</script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",sans-serif;color:#24302b;background:#f8f8f4}.shell{height:100vh;display:grid;grid-template-columns:340px 1fr}.side{padding:24px;overflow:auto;border-right:1px solid #dfe6e1;background:#fbfaf6;z-index:2}.brand{font-size:21px;font-weight:900;text-decoration:none}.brand span{color:#176b50}h1{font-size:29px;line-height:1.15;letter-spacing:-.04em;margin:33px 0 10px}.intro{color:#6f7b75;font-size:14px;line-height:1.6}.pool{display:block;width:100%;text-align:left;border:1px solid #dfe6e1;background:white;border-radius:16px;padding:15px;margin:10px 0;cursor:pointer}.pool:hover,.pool.active{border-color:#176b50;box-shadow:0 0 0 2px #dff2e8}.pool b{display:block;font-size:16px;margin-bottom:6px}.pool small{color:#6f7b75}.state{display:inline-block;margin-top:9px;border-radius:999px;padding:4px 8px;background:#dff2e8;color:#176b50;font-size:11px;font-weight:800}.back{display:inline-block;margin-top:20px;color:#176b50;font-weight:800;text-decoration:none}.map{height:100vh}.error{height:100%;display:grid;place-items:center;padding:30px;text-align:center;color:#6f7b75}.info{width:245px;padding:8px}.info h3{margin:0 0 7px;font-size:17px}.info p{margin:5px 0;color:#6f7b75;font-size:12px;line-height:1.45}.info a{display:block;margin-top:10px;padding:9px;background:#176b50;color:white;text-align:center;border-radius:10px;text-decoration:none;font-size:12px;font-weight:800}@media(max-width:720px){.shell{grid-template-columns:1fr;grid-template-rows:42vh 58vh}.side{grid-row:2;padding:18px}.map{height:42vh;grid-row:1}.side h1{margin-top:18px}}</style></head>
<body><div class="shell"><aside class="side"><a class="brand" href="index.html">자수<span>하자</span></a><h1>마포·양천<br>자유수영 지도</h1><p class="intro">핀을 누르면 시간표와 길찾기를 볼 수 있어요. 길찾기 화면에서 대중교통·도보·자동차를 선택하세요.</p><div id="list"></div><a class="back" href="index.html">← 시간표와 후기 보기</a></aside><div class="map" id="map_div"></div></div>
<script>let 지도,수영장=[],정보창;function 읽기(){return fetch('수영장.csv',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(t=>Papa.parse(t.replace(/\r\n?/g,'\n'),{header:true,skipEmptyLines:true,newline:'\n'}).data.filter(x=>['가능','휴관중'].includes(x.성인자유수영)))}function 핀(공식,휴관){const 색=휴관?'#777777':공식?'#176b50':'#d88342',s=`<svg xmlns="http://www.w3.org/2000/svg" width="38" height="48"><path fill="${색}" d="M19 1C9.1 1 1 9.1 1 19c0 13.5 18 28 18 28s18-14.5 18-28C37 9.1 28.9 1 19 1z"/><circle cx="19" cy="19" r="10" fill="white"/><text x="19" y="24" text-anchor="middle" font-size="14">🏊</text></svg>`;return'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(s)}function 길찾기링크(p){return `https://map.kakao.com/link/to/${encodeURIComponent(p.이름)},${p.위도},${p.경도}`}function 열기(i){const p=수영장[i];document.querySelectorAll('.pool').forEach((b,n)=>b.classList.toggle('active',n===i));const pos=new Tmapv2.LatLng(+p.위도,+p.경도);지도.setCenter(pos);지도.setZoom(16);if(정보창)정보창.setMap(null);정보창=new Tmapv2.InfoWindow({position:pos,content:`<div class="info"><h3>${p.이름}</h3><p>${p.주소}</p><p><b>${p.성인자유수영==='휴관중'?'휴관 중 · 현재 이용 불가':p.정보상태}</b><br>${p.성인자유수영==='휴관중'?'자유수영 운영 중단. 재개장 일정은 운영처 최신 공지를 확인해 주세요.':p.비고||''}</p><a href="${길찾기링크(p)}" target="_blank" rel="noopener">대중교통·도보·자동차 길찾기</a><a href="index.html">시간표·후기 보기</a></div>`,type:2,map:지도})}function 시작(){if(typeof Tmapv2==='undefined'){document.getElementById('map_div').innerHTML='<div class="error">TMAP 지도를 불러오지 못했어요.<br>TMAP_KEY 설정을 확인해 주세요.</div>';return}지도=new Tmapv2.Map('map_div',{center:new Tmapv2.LatLng(37.556,126.935),width:'100%',height:'100%',zoom:13});수영장.forEach((p,i)=>{const m=new Tmapv2.Marker({position:new Tmapv2.LatLng(+p.위도,+p.경도),icon:핀(p.정보상태==='공식확인',p.성인자유수영==='휴관중'),iconSize:new Tmapv2.Size(38,48),map:지도});m.addListener('click',()=>열기(i))});const q=new URLSearchParams(location.search).get('수영장'),i=수영장.findIndex(p=>p.이름===q);if(i>=0)열기(i)}document.getElementById('list').onclick=e=>{const b=e.target.closest('[data-i]');if(b)열기(+b.dataset.i)};읽기().then(p=>{수영장=p;document.getElementById('list').innerHTML=p.map((x,i)=>`<button class="pool" data-i="${i}"><b>${x.이름}</b><small>${x.주소}</small><span class="state">${x.성인자유수영==='휴관중'?'휴관 중 · 현재 이용 불가':x.정보상태}</span></button>`).join('');시작()}).catch(e=>document.getElementById('map_div').innerHTML=`<div class="error">수영장 데이터를 불러오지 못했어요.<br>${e.message}</div>`);</script></body></html>
